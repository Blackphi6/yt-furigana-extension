<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YT Caption Overlay</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Caption Overlay</h1>
        <p class="sub">自作字幕を YouTube 上に疑似表示（実験）</p>
      </header>

      <label class="toggle" for="enabled">
        <span>オーバーレイを表示</span>
        <input type="checkbox" id="enabled" checked />
      </label>

      <label class="toggle" for="hide-native">
        <span>ネイティブ字幕を隠す（重複を防ぐ）</span>
        <input type="checkbox" id="hide-native" checked />
      </label>

      <label class="field">
        <span>字幕ファイル（SRT / VTT / SRV3 / json3）</span>
        <input
          type="file"
          id="file"
          accept=".srt,.vtt,.ytt,.srv3,.xml,.json,.txt,text/vtt,application/json,text/plain"
        />
      </label>

      <label class="field">
        <span>文字サイズ <em id="font-size-label">28</em>px</span>
        <input type="range" id="font-size" min="16" max="56" step="1" value="28" />
      </label>

      <p class="status" id="status" role="status"></p>

      <div class="actions">
        <button type="button" class="btn ghost" id="clear" disabled>クリア</button>
      </div>

      <p class="note">
        改行位置は YouTube ネイティブ字幕の行分割を見てから決めます（字幕ON推奨）。
        timedtext には触れません。書き出しサイトの <code>.vtt</code> /
        <code>.ytt</code> をそのまま載せられます。
      </p>
    </main>
    <script src="../dist/popup.js" type="module"></script>
  </body>
</html>
